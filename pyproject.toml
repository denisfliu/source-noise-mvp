[project]
name = "snmvp"
version = "0.1.0"
description = "Source-noise action steering MVP: linear-pin noise calibration for flow-matching action heads"
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
